<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>導師 AI 劇場助理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass-morphism {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-2xl w-full glass-morphism rounded-2xl shadow-2xl p-8">
        <!-- 標題區 -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">🍎 導師 AI 班務助理</h1>
            <p class="text-slate-500">將瑣碎的日常，轉化為有溫度的專業敘事</p>
        </div>

        <!-- 輸入區 -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">事件原始紀錄：</label>
                <textarea id="userInput" rows="5" class="w-full p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" 
                    placeholder="例如：小明今天午休跟同學搶玩具，後來有道歉..."></textarea>
            </div>

            <!-- 選項 -->
            <div class="flex gap-4 mb-4">
                <button onclick="processAI('parent')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition shadow-lg">
                    <i class="fa-regular fa-message mr-2"></i> 生成家長訊息
                </button>
                <button onclick="processAI('counseling')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl transition shadow-lg">
                    <i class="fa-solid fa-file-pen mr-2"></i> 轉化輔導紀錄
                </button>
            </div>
        </div>

        <!-- 輸出區 -->
        <div id="loading" class="hidden text-center py-8">
            <div class="animate-spin text-blue-600 text-3xl mb-2"><i class="fa-solid fa-circle-notch"></i></div>
            <p class="text-slate-500 italic">AI 正在構思文字節奏...</p>
        </div>

        <div id="outputSection" class="hidden mt-8 border-t border-slate-100 pt-6">
            <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">AI 建議草稿</h3>
            <div id="result" class="p-6 bg-slate-50 rounded-xl text-slate-800 leading-relaxed whitespace-pre-wrap"></div>
            <button onclick="copyToClipboard()" class="mt-4 text-sm text-blue-600 hover:text-blue-800 font-medium">
                <i class="fa-regular fa-copy mr-1"></i> 複製內容
            </button>
        </div>
    </div>

    <script>
        async function processAI(mode) {
            const input = document.getElementById('userInput').value;
            if (!input) return alert('請先輸入事件描述');

            const loading = document.getElementById('loading');
            const outputSection = document.getElementById('outputSection');
            const resultDiv = document.getElementById('result');

            loading.classList.remove('hidden');
            outputSection.classList.add('hidden');

            let systemPrompt = "";
            if (mode === 'parent') {
                systemPrompt = "你是一位充滿教育熱誠且專業的國小導師，擅長用溫柔且堅定的口吻與家長溝通。請將以下事件轉化為給家長的通訊錄訊息，語氣要委婉，並強調親師合作。";
            } else {
                systemPrompt = "你是一位理性的輔導研究者，請將以下事件轉化為正式、中立且結構清晰的輔導紀錄文字，避免情緒化字眼。";
            }

            try {
                const response = await fetch('/api/assistant', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: systemPrompt + "\n\n事件內容：" + input })
                });

                const data = await response.json();
                // 根據 Gemini API 的資料結構抓取文字
                resultDiv.innerText = data.candidates[0].content.parts[0].text;
                outputSection.classList.remove('hidden');
            } catch (error) {
                alert('連線失敗，請檢查 Vercel 環境變數設定');
            } finally {
                loading.classList.add('hidden');
            }
        }

        function copyToClipboard() {
            const text = document.getElementById('result').innerText;
            navigator.clipboard.writeText(text);
            alert('已複製到剪貼簿！');
        }
    </script>
</body>
</html>
